# --- Status bar ---
set -g status-position bottom
set -g status-style "bg=#FAFAFA,fg=#383A42"
set -g status-left ""
set -g status-right "#[fg=#0184BC]#{b:pane_current_path}#[default] · #(~/Documents/Personal/dotfiles/scripts/tmux-git-branch.sh #{pane_current_path}) "
set -g status-right-length 80
set -g status-interval 5

# --- Clean look ---
set -g window-status-format ""
set -g window-status-current-format ""
set -g message-style "bg=#FAFAFA,fg=#383A42"

# --- Window sizing ---
set -g aggressive-resize on

# --- Terminal features ---
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g mouse on
set -g escape-time 0
